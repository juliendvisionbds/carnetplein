<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 742" width="800" height="742" role="img" aria-labelledby="t d"><title id="t">Relevé : ma semaine de demandes</title><desc id="d">Exemple de tableau de relevé sur une semaine, avec pour chaque demande l'heure de réception, le canal, la première réponse, le rappel et la suite.</desc><rect width="800" height="742" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Relevé : ma semaine de demandes</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Exemple rempli. Notez chaque demande pendant 7 jours.</text><rect x="56" y="168" width="688" height="464" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="168" width="688" height="58" rx="14" fill="#1C1B19"/><rect x="56" y="212" width="688" height="14" fill="#1C1B19"/><text x="70" y="204" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Reçue</text><text x="210" y="204" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Canal</text><text x="330" y="204" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">1re réponse</text><text x="466" y="204" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Rappel</text><text x="606" y="204" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Suite</text><text x="70" y="262" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start">Lun 9 h 40</text><text x="210" y="262" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Site</text><text x="330" y="262" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">9 h 42 (SMS)</text><text x="466" y="262" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">12 h 35</text><text x="606" y="262" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Visite jeudi</text><line x1="56" y1="284" x2="744" y2="284" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="320" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start">Lun 16 h 50</text><text x="210" y="320" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Tél.</text><text x="330" y="320" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">18 h 05</text><text x="466" y="320" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">18 h 05</text><text x="606" y="320" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Devis vendr.</text><rect x="58" y="342" width="684" height="58" fill="#F7E3E1"/><line x1="56" y1="342" x2="744" y2="342" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="378" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start">Mar 11 h 15</text><text x="210" y="378" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">E-mail</text><text x="330" y="378" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Aucune</text><text x="466" y="378" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Mer 18 h</text><text x="606" y="378" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Sans réponse</text><rect x="58" y="400" width="684" height="58" fill="#F7E3E1"/><line x1="56" y1="400" x2="744" y2="400" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="436" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start">Mer 20 h 30</text><text x="210" y="436" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Plateforme</text><text x="330" y="436" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Aucune</text><text x="466" y="436" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Jeu 12 h 40</text><text x="606" y="436" font-size="17" font-weight="400" fill="#B23A3A" text-anchor="start">Déjà pris</text><line x1="56" y1="458" x2="744" y2="458" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="494" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start">Jeu 8 h 10</text><text x="210" y="494" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Site</text><text x="330" y="494" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">8 h 12 (SMS)</text><text x="466" y="494" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">12 h 30</text><text x="606" y="494" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start">Visite lundi</text><line x1="56" y1="516" x2="744" y2="516" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="552" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start"></text><text x="210" y="552" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="330" y="552" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="466" y="552" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="606" y="552" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><line x1="56" y1="574" x2="744" y2="574" stroke="#DDD8CE" stroke-width="1.5"/><text x="70" y="610" font-size="17" font-weight="600" fill="#1C1B19" text-anchor="start"></text><text x="210" y="610" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="330" y="610" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="466" y="610" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><text x="606" y="610" font-size="17" font-weight="400" fill="#1C1B19" text-anchor="start"></text><rect x="56" y="656" width="22" height="22" rx="4" fill="#F7E3E1" stroke="#B23A3A" stroke-width="1.5"/><text x="90" y="673" font-size="18" font-weight="500" fill="#1C1B19" text-anchor="start">Plus d'une demi-journée sans aucune réponse</text><text x="56" y="716" font-size="18" font-weight="400" fill="