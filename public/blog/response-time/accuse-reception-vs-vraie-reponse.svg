<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" role="img" aria-labelledby="t d"><title id="t">Deux réponses à ne pas confondre</title><desc id="d">Comparaison entre l'accusé de réception, envoyé tout de suite en 10 secondes, et la vraie réponse, donnée dans la journée lors d'un appel.</desc><rect width="800" height="860" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Deux réponses à ne pas confondre</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Le silence entre les deux fait perdre des projets.</text><rect x="56" y="160" width="328" height="620" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="160" width="328" height="104" rx="18" fill="#E3EFEA"/><rect x="56" y="230" width="328" height="34" fill="#E3EFEA"/><text x="80" y="206" font-size="25" font-weight="700" fill="#1F6F5C" text-anchor="start">Accusé de réception</text><text x="80" y="240" font-size="18" font-weight="600" fill="#1F6F5C" text-anchor="start">Doit partir vite</text><text x="80" y="304" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">QUAND</text><text x="80" y="336" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Tout de suite,</text><text x="80" y="363" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">idéalement dans l'heure</text><line x1="80" y1="392" x2="360" y2="392" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="424" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TEMPS NÉCESSAIRE</text><text x="80" y="456" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">10 secondes</text><line x1="80" y1="512" x2="360" y2="512" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="544" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">CONTENU</text><text x="80" y="576" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Merci + l'heure du rappel</text><text x="80" y="603" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">+ une question utile</text><line x1="80" y1="632" x2="360" y2="632" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="664" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">OUTIL</text><text x="80" y="696" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">SMS enregistré, réponse</text><text x="80" y="723" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">automatique, répondeur</text><rect x="416" y="160" width="328" height="620" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="416" y="160" width="328" height="104" rx="18" fill="#F6E7DB"/><rect x="416" y="230" width="328" height="34" fill="#F6E7DB"/><text x="440" y="206" font-size="25" font-weight="700" fill="#C26A2E" text-anchor="start">Vraie réponse</text><text x="440" y="240" font-size="18" font-weight="600" fill="#C26A2E" text-anchor="start">Peut attendre un créneau</text><text x="440" y="304" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">QUAND</text><text x="440" y="336" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Dans la journée,</text><text x="440" y="363" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">à un créneau fixe</text><line x1="440" y1="392" x2="720" y2="392" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="424" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TEMPS NÉCESSAIRE</text><text x="440" y="456" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">5 à 15 minutes</text><line x1="440" y1="512" x2="720" y2="512" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="544" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">CONTENU</text><text x="440" y="576" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Comprendre le projet,</text><text x="440" y="603" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">fixer la suite</text><line x1="440" y1="632" x2="720" y2="632" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="664" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">OUTIL</text><text x="440" y="696" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Un appel au calme,</text><text x="440" y="723" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">carnet en main</text><text x="56" y="820" font-size="19" font-weight="600" fill="#1C1B19" text-anchor="start">Donnez toujours une heure précise : « je vous rappelle vers 18 h ».</text></g></svg>