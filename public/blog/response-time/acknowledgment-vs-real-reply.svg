<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="800" height="860" role="img" aria-labelledby="t d"><title id="t">Two replies you shouldn't mix up</title><desc id="d">Comparison between the acknowledgment, sent right away in 10 seconds, and the real reply, given the same day on a call.</desc><rect width="800" height="860" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Two replies you shouldn't mix up</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">The silence in between is what loses jobs.</text><rect x="56" y="160" width="328" height="620" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="160" width="328" height="104" rx="18" fill="#E3EFEA"/><rect x="56" y="230" width="328" height="34" fill="#E3EFEA"/><text x="80" y="206" font-size="25" font-weight="700" fill="#1F6F5C" text-anchor="start">Acknowledgment</text><text x="80" y="240" font-size="18" font-weight="600" fill="#1F6F5C" text-anchor="start">Must go out fast</text><text x="80" y="304" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">WHEN</text><text x="80" y="336" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Right away,</text><text x="80" y="363" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">ideally within the hour</text><line x1="80" y1="392" x2="360" y2="392" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="424" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TIME IT TAKES</text><text x="80" y="456" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">10 seconds</text><line x1="80" y1="512" x2="360" y2="512" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="544" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">WHAT IT SAYS</text><text x="80" y="576" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Thanks + call-back time</text><text x="80" y="603" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">+ one useful question</text><line x1="80" y1="632" x2="360" y2="632" stroke="#DDD8CE" stroke-width="1.5"/><text x="80" y="664" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TOOL</text><text x="80" y="696" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Saved text, auto-reply,</text><text x="80" y="723" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">voicemail message</text><rect x="416" y="160" width="328" height="620" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="416" y="160" width="328" height="104" rx="18" fill="#F6E7DB"/><rect x="416" y="230" width="328" height="34" fill="#F6E7DB"/><text x="440" y="206" font-size="25" font-weight="700" fill="#C26A2E" text-anchor="start">Real reply</text><text x="440" y="240" font-size="18" font-weight="600" fill="#C26A2E" text-anchor="start">Can wait for a slot</text><text x="440" y="304" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">WHEN</text><text x="440" y="336" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Same day,</text><text x="440" y="363" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">at a fixed time slot</text><line x1="440" y1="392" x2="720" y2="392" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="424" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TIME IT TAKES</text><text x="440" y="456" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">5 to 15 minutes</text><line x1="440" y1="512" x2="720" y2="512" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="544" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">WHAT IT SAYS</text><text x="440" y="576" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">Understand the project,</text><text x="440" y="603" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">agree the next step</text><line x1="440" y1="632" x2="720" y2="632" stroke="#DDD8CE" stroke-width="1.5"/><text x="440" y="664" font-size="15" font-weight="700" fill="#6B675F" text-anchor="start">TOOL</text><text x="440" y="696" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">A calm call,</text><text x="440" y="723" font-size="20" font-weight="500" fill="#1C1B19" text-anchor="start">notebook in hand</text><text x="56" y="820" font-size="19" font-weight="600" fill="#1C1B19" text-anchor="start">Always give a specific time: "I'll call you around 6pm."</text></g></svg>