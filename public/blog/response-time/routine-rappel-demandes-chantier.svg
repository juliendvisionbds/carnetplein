<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 784" width="800" height="784" role="img" aria-labelledby="t d"><title id="t">Une journée sans demande oubliée</title><desc id="d">Exemple de journée : chaque demande reçue reçoit un accusé immédiat, puis un rappel au créneau de 12 h 30 ou de 18 h.</desc><rect width="800" height="784" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Une journée sans demande oubliée</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Accusé tout de suite, rappel au créneau suivant.</text><line x1="150" y1="204" x2="150" y2="664" stroke="#DDD8CE" stroke-width="4"/><text x="120" y="211" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">9 h 40</text><circle cx="150" cy="204" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="166" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="198" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Nouvelle demande (site)</text><text x="210" y="228" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ SMS d'accusé envoyé : « je rappelle à 12 h 30 »</text><text x="120" y="303" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">11 h 15</text><circle cx="150" cy="296" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="258" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="290" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Appel manqué</text><text x="210" y="320" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Le répondeur annonce les rappels de midi et du soir</text><text x="120" y="395" font-size="20" font-weight="700" fill="#1C1B19" text-anchor="end">12 h 30</text><circle cx="150" cy="388" r="16" fill="#1F6F5C"/><rect x="186" y="350" width="558" height="76" rx="16" fill="#1F6F5C"/><text x="210" y="382" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Créneau de rappel</text><text x="210" y="412" font-size="18" font-weight="400" fill="#E3EFEA" text-anchor="start">Rappeler les demandes de 9 h 40 et 11 h 15</text><text x="120" y="487" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">14 h 20</text><circle cx="150" cy="480" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="442" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="474" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Nouvelle demande (e-mail)</text><text x="210" y="504" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Réponse automatique avec demande de photos</text><text x="120" y="579" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">16 h 50</text><circle cx="150" cy="572" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="534" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="566" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Nouvelle demande (plateforme)</text><text x="210" y="596" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ SMS d'accusé envoyé : « je rappelle à 18 h »</text><text x="120" y="671" font-size="20" font-weight="700" fill="#1C1B19" text-anchor="end">18 h 00</text><circle cx="150" cy="664" r="16" fill="#1F6F5C"/><rect x="186" y="626" width="558" height="76" rx="16" fill="#1F6F5C"/><text x="210" y="658" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Créneau de rappel</text><text x="210" y="688" font-size="18" font-weight="400" fill="#E3EFEA" text-anchor="start">Rappeler les demandes de 14 h 20 et 16 h 50</text><text x="56" y="760" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Aucune demande n'attend plus de quelques heures.</text></g></svg>