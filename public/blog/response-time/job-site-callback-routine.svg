<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 784" width="800" height="784" role="img" aria-labelledby="t d"><title id="t">A day on site, with no request forgotten</title><desc id="d">Example day: each request gets an instant acknowledgment, then a call-back at the 12:30pm or 6pm slot.</desc><rect width="800" height="784" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">A day on site, with no request forgotten</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Acknowledge right away, call back at the next slot.</text><line x1="150" y1="204" x2="150" y2="664" stroke="#DDD8CE" stroke-width="4"/><text x="120" y="211" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">9:40am</text><circle cx="150" cy="204" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="166" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="198" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">New request (website)</text><text x="210" y="228" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Acknowledgment text: "I'll call at 12:30"</text><text x="120" y="303" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">11:15am</text><circle cx="150" cy="296" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="258" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="290" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Missed call</text><text x="210" y="320" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Voicemail says you call back at lunch and 6pm</text><text x="120" y="395" font-size="20" font-weight="700" fill="#1C1B19" text-anchor="end">12:30pm</text><circle cx="150" cy="388" r="16" fill="#1F6F5C"/><rect x="186" y="350" width="558" height="76" rx="16" fill="#1F6F5C"/><text x="210" y="382" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Call-back slot</text><text x="210" y="412" font-size="18" font-weight="400" fill="#E3EFEA" text-anchor="start">Call back the 9:40 and 11:15 requests</text><text x="120" y="487" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">2:20pm</text><circle cx="150" cy="480" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="442" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="474" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">New request (email)</text><text x="210" y="504" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Auto-reply asks for a few photos</text><text x="120" y="579" font-size="20" font-weight="700" fill="#6B675F" text-anchor="end">4:50pm</text><circle cx="150" cy="572" r="11" fill="#FFFFFF" stroke="#C26A2E" stroke-width="4"/><rect x="186" y="534" width="558" height="76" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="210" y="566" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">New request (lead platform)</text><text x="210" y="596" font-size="18" font-weight="500" fill="#1F6F5C" text-anchor="start">✓ Acknowledgment text: "I'll call at 6pm"</text><text x="120" y="671" font-size="20" font-weight="700" fill="#1C1B19" text-anchor="end">6:00pm</text><circle cx="150" cy="664" r="16" fill="#1F6F5C"/><rect x="186" y="626" width="558" height="76" rx="16" fill="#1F6F5C"/><text x="210" y="658" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Call-back slot</text><text x="210" y="688" font-size="18" font-weight="400" fill="#E3EFEA" text-anchor="start">Call back the 2:20 and 4:50 requests</text><text x="56" y="760" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">No request waits more than a few hours.</text></g></svg>