<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-labelledby="t d"><title id="t">After the call: visit, estimate or decline</title><desc id="d">Decision diagram: depending on the number of warning signs, book a visit, give a phone estimate, or decline.</desc><rect width="800" height="820" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">After the call: visit, estimate or decline</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Count the warning signs before you travel.</text><rect x="56" y="160" width="688" height="250" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="84" y="204" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Warning signs</text><path d="M86 232 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="239" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="244" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="246" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Budget far from the real price</text><path d="M86 268 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="275" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="280" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="282" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">A deadline you can't meet</text><path d="M86 304 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="311" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="316" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="318" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">The decision-maker stays out of it</text><path d="M86 340 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="347" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="352" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="354" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Lots of quotes compared on price alone</text><path d="M86 376 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="383" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="388" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="390" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Outside your area or your trade</text><line x1="400" y1="410" x2="400" y2="448" stroke="#6B675F" stroke-width="3"/><path d="M164 448 H 636" fill="none" stroke="#6B675F" stroke-width="3"/><line x1="164.0" y1="448" x2="164.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M156.0 476 L164.0 488 L172.0 476z" fill="#6B675F"/><rect x="56" y="492" width="216" height="236" rx="18" fill="#E3EFEA"/><text x="76" y="532" font-size="18" font-weight="700" fill="#1F6F5C" text-anchor="start">0 or 1 sign</text><text x="76" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Visit</text><text x="76" y="625" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Book the appointment</text><text x="76" y="650" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">and the quote date.</text><line x1="400.0" y1="448" x2="400.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M392.0 476 L400.0 488 L408.0 476z" fill="#6B675F"/><rect x="292" y="492" width="216" height="236" rx="18" fill="#F6E7DB"/><text x="312" y="532" font-size="18" font-weight="700" fill="#C26A2E" text-anchor="start">2 signs</text><text x="312" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Estimate</text><text x="312" y="605" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">first</text><text x="312" y="654" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Give a price range</text><text x="312" y="679" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">by phone. Only travel</text><text x="312" y="704" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">if it works for them.</text><line x1="636.0" y1="448" x2="636.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M628.0 476 L636.0 488 L644.0 476z" fill="#6B675F"/><rect x="528" y="492" width="216" height="236" rx="18" fill="#F7E3E1"/><text x="548" y="532" font-size="18" font-weight="700" fill="#B23A3A" text-anchor="start">3 signs or more</text><text x="548" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Politely</text><text x="548" y="605" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">decline</text><text x="548" y="654" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Or refer them to a</text><text x="548" y="679" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">better-placed firm.</text><text x="56" y="788" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Declining a job keeps time free for the ones with a real chance.</text></g></svg>