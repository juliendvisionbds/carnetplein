<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-labelledby="t d"><title id="t">Après l'appel : visite, estimation ou refus</title><desc id="d">Schéma de décision : selon le nombre de signaux d'alerte, faire une visite, donner une estimation par téléphone, ou décliner.</desc><rect width="800" height="820" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Après l'appel : visite, estimation ou refus</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Comptez les signaux d'alerte avant de vous déplacer.</text><rect x="56" y="160" width="688" height="250" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="84" y="204" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Les signaux d'alerte</text><path d="M86 232 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="239" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="244" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="246" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Budget très éloigné du prix réel</text><path d="M86 268 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="275" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="280" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="282" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Délai impossible à tenir</text><path d="M86 304 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="311" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="316" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="318" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">La personne qui décide reste absente</text><path d="M86 340 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="347" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="352" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="354" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Beaucoup de devis comparés sur le seul prix</text><path d="M86 376 l10 -0 l-5 -9z" fill="none"/><circle cx="93" cy="383" r="9" fill="#F7E3E1" stroke="#B23A3A" stroke-width="2"/><text x="93" y="388" font-size="13" font-weight="800" fill="#B23A3A" text-anchor="middle">!</text><text x="114" y="390" font-size="19" font-weight="400" fill="#1C1B19" text-anchor="start">Hors de votre zone ou de votre métier</text><line x1="400" y1="410" x2="400" y2="448" stroke="#6B675F" stroke-width="3"/><path d="M164 448 H 636" fill="none" stroke="#6B675F" stroke-width="3"/><line x1="164.0" y1="448" x2="164.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M156.0 476 L164.0 488 L172.0 476z" fill="#6B675F"/><rect x="56" y="492" width="216" height="236" rx="18" fill="#E3EFEA"/><text x="76" y="532" font-size="18" font-weight="700" fill="#1F6F5C" text-anchor="start">0 ou 1 signal</text><text x="76" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Visite</text><text x="76" y="625" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Fixez le rendez-vous</text><text x="76" y="650" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">et la date du devis.</text><line x1="400.0" y1="448" x2="400.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M392.0 476 L400.0 488 L408.0 476z" fill="#6B675F"/><rect x="292" y="492" width="216" height="236" rx="18" fill="#F6E7DB"/><text x="312" y="532" font-size="18" font-weight="700" fill="#C26A2E" text-anchor="start">2 signaux</text><text x="312" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Estimation</text><text x="312" y="605" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">d'abord</text><text x="312" y="654" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Donnez une fourchette</text><text x="312" y="679" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">par téléphone. Ne vous</text><text x="312" y="704" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">déplacez que si elle</text><text x="312" y="729" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">convient.</text><line x1="636.0" y1="448" x2="636.0" y2="480" stroke="#6B675F" stroke-width="3"/><path d="M628.0 476 L636.0 488 L644.0 476z" fill="#6B675F"/><rect x="528" y="492" width="216" height="236" rx="18" fill="#F7E3E1"/><text x="548" y="532" font-size="18" font-weight="700" fill="#B23A3A" text-anchor="start">3 signaux ou plus</text><text x="548" y="576" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">Décliner</text><text x="548" y="605" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">poliment</text><text x="548" y="654" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Ou orientez vers un</text><text x="548" y="679" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">confrère mieux placé.</text><text x="56" y="788" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Décliner un projet, c'est garder du temps pour ceux qui ont une vraie chance.</text></g></svg>