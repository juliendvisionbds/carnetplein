<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 898" width="800" height="898" role="img" aria-labelledby="t d"><title id="t">Demander le budget, sans gêne</title><desc id="d">Trois façons de demander le budget au client : proposer des fourchettes, donner un ordre de prix, présenter des niveaux d'options.</desc><rect width="800" height="898" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Demander le budget, sans gêne</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Trois façons de poser la question, toujours avec un repère.</text><rect x="56" y="160" width="688" height="202" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="160" width="8" height="202" rx="4" fill="#1F6F5C"/><text x="88" y="204" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">Proposer des fourchettes</text><text x="88" y="236" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Le client choisit une case, sans donner de chiffre.</text><rect x="88" y="256" width="632" height="82" rx="16" fill="#E3EFEA"/><path d="M110 256 l14 -14 l6 14z" fill="#E3EFEA"/><text x="110" y="292" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">« Vous vous situez plutôt autour de [montant A],</text><text x="110" y="320" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">de [montant B], ou au-delà ? »</text><rect x="56" y="380" width="688" height="230" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="380" width="8" height="230" rx="4" fill="#C26A2E"/><text x="88" y="424" font-size="24" font-weight="700" fill="#C26A2E" text-anchor="start">Donner un ordre de prix</text><text x="88" y="456" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Vous donnez un repère, le client réagit.</text><rect x="88" y="476" width="632" height="110" rx="16" fill="#F6E7DB"/><path d="M110 476 l14 -14 l6 14z" fill="#F6E7DB"/><text x="110" y="512" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">« Les projets comme le vôtre se situent souvent</text><text x="110" y="540" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">entre [montant] et [montant]. Ça correspond à</text><text x="110" y="568" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">ce que vous aviez en tête ? »</text><rect x="56" y="628" width="688" height="202" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="56" y="628" width="8" height="202" rx="4" fill="#3D5A98"/><text x="88" y="672" font-size="24" font-weight="700" fill="#3D5A98" text-anchor="start">Présenter des niveaux</text><text x="88" y="704" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Le budget devient un choix plutôt qu'une somme.</text><rect x="88" y="724" width="632" height="82" rx="16" fill="#E3E9F4"/><path d="M110 724 l14 -14 l6 14z" fill="#E3E9F4"/><text x="110" y="760" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">« Simple, intermédiaire ou haut de gamme :</text><text x="110" y="788" font-size="19.5" font-weight="500" fill="#1C1B19" text-anchor="start" font-style="italic">vous penchez plutôt vers laquelle ? »</text><text x="56" y="868" font-size="19" font-weight="600" fill="#1C1B19" text-anchor="start">Sans repère, le client ne sait pas quoi répondre.</text></g></svg>