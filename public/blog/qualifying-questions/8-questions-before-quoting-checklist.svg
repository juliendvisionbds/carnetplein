<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1074" width="800" height="1074" role="img" aria-labelledby="t d"><title id="t">Before you quote: 8 questions</title><desc id="d">Printable checklist of the 8 questions to ask before quoting, with a line to note each answer.</desc><rect width="800" height="1074" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Before you quote: 8 questions</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Ask them on the first call. About ten minutes.</text><rect x="56" y="160" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="190" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="202" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">1. The project in a few words</text><text x="140" y="232" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">What the customer really wants</text><line x1="500" y1="230" x2="720" y2="230" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><text x="500" y="200" font-size="15" font-weight="600" fill="#6B675F" text-anchor="start">Answers</text><rect x="56" y="268" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="298" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="310" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">2. Location and access</text><text x="140" y="340" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Area, floor, parking</text><line x1="500" y1="338" x2="720" y2="338" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="376" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="406" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="418" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">3. Timing</text><text x="140" y="448" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">A real project or far off?</text><line x1="500" y1="446" x2="720" y2="446" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="484" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="514" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="526" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">4. Budget in mind</text><text x="140" y="556" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Ranges or similar projects</text><line x1="500" y1="554" x2="720" y2="554" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="592" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="622" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="634" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">5. Who decides</text><text x="140" y="664" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Invite the other person</text><line x1="500" y1="662" x2="720" y2="662" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="700" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="730" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="742" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">6. Other quotes</text><text x="140" y="772" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Know where you stand</text><line x1="500" y1="770" x2="720" y2="770" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="808" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="838" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="850" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">7. A few photos</text><text x="140" y="880" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Prepare the visit</text><line x1="500" y1="878" x2="720" y2="878" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><rect x="56" y="916" width="688" height="96" rx="14" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><rect x="80" y="946" width="34" height="34" rx="7" fill="none" stroke="#1F6F5C" stroke-width="3"/><text x="140" y="958" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="start">8. What matters most</text><text x="140" y="988" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">What your quote must show</text><line x1="500" y1="986" x2="720" y2="986" stroke="#DDD8CE" stroke-width="2" stroke-dasharray="3 6"/><text x="56" y="1050" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Print it and keep it by the phone.</text></g></svg>