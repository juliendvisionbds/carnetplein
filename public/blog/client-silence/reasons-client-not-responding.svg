<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1062" width="800" height="1062" role="img" aria-labelledby="t d"><title id="t">What is the silence hiding?</title><desc id="d">Six reasons a client stops responding after a quote, with the signal to look for and the message to send.</desc><rect width="800" height="1062" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">What is the silence hiding?</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Six common reasons, and the message that answers each one.</text><rect x="56" y="160" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="204" r="22" fill="#E3EFEA"/><text x="104" y="211" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">1</text><text x="146" y="212" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">They're still comparing</text><text x="146" y="244" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: "it's just to get an idea"</text><text x="146" y="272" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ What to compare</text><rect x="56" y="302" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="346" r="22" fill="#E3EFEA"/><text x="104" y="353" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">2</text><text x="146" y="354" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">The budget doesn't fit</text><text x="146" y="386" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: no budget given at the appointment</text><text x="146" y="414" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ An adjusted version</text><rect x="56" y="444" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="488" r="22" fill="#E3EFEA"/><text x="104" y="495" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">3</text><text x="146" y="496" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">The timing isn't right</text><text x="146" y="528" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: a loan, a grant, a deadline</text><text x="146" y="556" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ "When should I check back?"</text><rect x="56" y="586" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="630" r="22" fill="#E3EFEA"/><text x="104" y="637" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">4</text><text x="146" y="638" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">The quote isn't clear</text><text x="146" y="670" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: a long, technical quote</text><text x="146" y="698" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ Five minutes of explanation</text><rect x="56" y="728" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="772" r="22" fill="#E3EFEA"/><text x="104" y="779" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">5</text><text x="146" y="780" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">They're not the one deciding</text><text x="146" y="812" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: "I'll talk it over"</text><text x="146" y="840" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ A walkthrough for both</text><rect x="56" y="870" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="914" r="22" fill="#E3EFEA"/><text x="104" y="921" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">6</text><text x="146" y="922" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">It slipped down the list</text><text x="146" y="954" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal: no other reason fits</text><text x="146" y="982" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ "Shall I keep your file open?"</text><text x="56" y="1036" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Start from what you heard at the appointment.</text></g></svg>