<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1062" width="800" height="1062" role="img" aria-labelledby="t d"><title id="t">Que cache le silence ?</title><desc id="d">Six raisons pour lesquelles un client ne répond plus après un devis, avec le signal à repérer et le message à envoyer.</desc><rect width="800" height="1062" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Que cache le silence ?</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Six raisons fréquentes, et le message qui répond à chacune.</text><rect x="56" y="160" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="204" r="22" fill="#E3EFEA"/><text x="104" y="211" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">1</text><text x="146" y="212" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Il compare encore</text><text x="146" y="244" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : « c'est pour avoir une idée »</text><text x="146" y="272" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ Les points à comparer</text><rect x="56" y="302" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="346" r="22" fill="#E3EFEA"/><text x="104" y="353" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">2</text><text x="146" y="354" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Le budget coince</text><text x="146" y="386" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : aucun budget donné au rendez-vous</text><text x="146" y="414" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ Une version ajustée</text><rect x="56" y="444" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="488" r="22" fill="#E3EFEA"/><text x="104" y="495" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">3</text><text x="146" y="496" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Le moment n'est pas le bon</text><text x="146" y="528" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : un prêt, une aide, une échéance</text><text x="146" y="556" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ « Quand revenir vers vous ? »</text><rect x="56" y="586" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="630" r="22" fill="#E3EFEA"/><text x="104" y="637" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">4</text><text x="146" y="638" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Le devis n'est pas clair</text><text x="146" y="670" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : un devis long et technique</text><text x="146" y="698" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ Cinq minutes d'explication</text><rect x="56" y="728" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="772" r="22" fill="#E3EFEA"/><text x="104" y="779" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">5</text><text x="146" y="780" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Ce n'est pas lui qui décide</text><text x="146" y="812" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : « je vais en parler »</text><text x="146" y="840" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ Une présentation à deux</text><rect x="56" y="870" width="688" height="128" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="104" cy="914" r="22" fill="#E3EFEA"/><text x="104" y="921" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">6</text><text x="146" y="922" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="start">Le projet n'est plus prioritaire</text><text x="146" y="954" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Signal : aucune autre raison ne colle</text><text x="146" y="982" font-size="19" font-weight="600" fill="#1F6F5C" text-anchor="start">→ « Je garde le dossier ouvert ? »</text><text x="56" y="1036" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Partez de ce que vous avez entendu au rendez-vous.</text></g></svg>