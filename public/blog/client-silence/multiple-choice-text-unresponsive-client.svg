<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720" role="img" aria-labelledby="t d"><title id="t">The multiple-choice message</title><desc id="d">Example multiple-choice text where the client replies with one letter, here B: waiting on financing.</desc><rect width="800" height="720" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">The multiple-choice message</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">When you can't tell what's blocking, just ask.</text><rect x="56" y="160" width="420" height="500" rx="44" fill="#1C1B19"/><rect x="70" y="174" width="392" height="472" rx="32" fill="#F1EEE8"/><rect x="216.0" y="186" width="100" height="10" rx="5" fill="#CFC9BE"/><text x="266.0" y="236" font-size="19" font-weight="600" fill="#6B675F" text-anchor="middle">Mr Davis (bathroom reno)</text><rect x="106" y="260" width="336" height="246" rx="18" fill="#1F6F5C"/><text x="126" y="296" font-size="18.5" font-weight="400" fill="#FFFFFF" text-anchor="start">Hi Mr Davis, it's Mark.</text><text x="126" y="323" font-size="18.5" font-weight="400" fill="#FFFFFF" text-anchor="start">So I don't chase you for</text><text x="126" y="350" font-size="18.5" font-weight="400" fill="#FFFFFF" text-anchor="start">nothing, where are you at?</text><text x="126" y="377" font-size="18.5" font-weight="700" fill="#FFFFFF" text-anchor="start">A. We still have questions</text><text x="126" y="404" font-size="18.5" font-weight="700" fill="#FFFFFF" text-anchor="start">B. Waiting on financing</text><text x="126" y="431" font-size="18.5" font-weight="700" fill="#FFFFFF" text-anchor="start">C. Project pushed back</text><text x="126" y="458" font-size="18.5" font-weight="700" fill="#FFFFFF" text-anchor="start">D. Went with another option</text><text x="126" y="485" font-size="18.5" font-weight="400" fill="#FFFFFF" text-anchor="start">Just the letter is fine!</text><rect x="90" y="528" width="70" height="52" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="125" y="562" font-size="24" font-weight="700" fill="#1C1B19" text-anchor="middle">B</text><text x="176" y="562" font-size="16" font-weight="400" fill="#6B675F" text-anchor="start">Answered in 2 seconds</text><rect x="512" y="192" width="6" height="90" rx="3" fill="#1F6F5C"/><text x="534" y="226" font-size="22" font-weight="700" fill="#1F6F5C" text-anchor="start">Minimal effort</text><text x="534" y="258" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">The client replies</text><text x="534" y="283" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">with one letter.</text><rect x="512" y="342" width="6" height="90" rx="3" fill="#C26A2E"/><text x="534" y="376" font-size="22" font-weight="700" fill="#C26A2E" text-anchor="start">A clear answer</text><text x="534" y="408" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Even a "D" tells you</text><text x="534" y="433" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">where you stand.</text><rect x="512" y="492" width="6" height="90" rx="3" fill="#6B675F"/><text x="534" y="526" font-size="22" font-weight="700" fill="#6B675F" text-anchor="start">No pressure</text><text x="534" y="558" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Every answer is</text><text x="534" y="583" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">acceptable.</text><text x="56" y="690" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Adapt choices B and C to what you know about the project.</text></g></svg>