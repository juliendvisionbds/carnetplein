<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" role="img" aria-labelledby="t d"><title id="t">Quand arrêter de relancer</title><desc id="d">Schéma : après trois tentatives utiles, envoyer un message de clôture ; si le client répond, noter la raison, sinon classer et prévoir un rappel.</desc><rect width="800" height="930" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Quand arrêter de relancer</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Insister au-delà devient contre-productif.</text><rect x="200" y="160" width="400" height="72" rx="16" fill="#EEEBE5" stroke="#DDD8CE" stroke-width="2"/><text x="400.0" y="203.35" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="middle">Devis sans réponse</text><line x1="400" y1="232" x2="400" y2="260" stroke="#6B675F" stroke-width="3"/><path d="M392 258 L400 270 L408 258z" fill="#6B675F"/><rect x="150" y="270" width="500" height="96" rx="16" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2"/><text x="400.0" y="311.35" font-size="21" font-weight="700" fill="#1F6F5C" text-anchor="middle">3 tentatives utiles</text><text x="400.0" y="339.35" font-size="21" font-weight="400" fill="#6B675F" text-anchor="middle">sur au moins 2 canaux différents</text><line x1="400" y1="366" x2="400" y2="394" stroke="#6B675F" stroke-width="3"/><path d="M392 392 L400 404 L408 392z" fill="#6B675F"/><rect x="150" y="404" width="500" height="96" rx="16" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="2"/><text x="400.0" y="445.35" font-size="21" font-weight="700" fill="#1F6F5C" text-anchor="middle">Message de clôture</text><text x="400.0" y="473.35" font-size="21" font-weight="400" fill="#6B675F" text-anchor="middle">« Je classe le dossier de mon côté »</text><line x1="400" y1="500" x2="400" y2="530" stroke="#6B675F" stroke-width="3"/><path d="M392 528 L400 540 L408 528z" fill="#6B675F"/><path d="M400 540 L510 600 L400 660 L290 600z" fill="#FFFFFF" stroke="#1C1B19" stroke-width="2.5"/><text x="400" y="608" font-size="22" font-weight="700" fill="#1C1B19" text-anchor="middle">Réponse ?</text><path d="M290 600 H 200 V 700" fill="none" stroke="#1F6F5C" stroke-width="3"/><path d="M192 690 L200 702 L208 690z" fill="#1F6F5C"/><path d="M510 600 H 600 V 700" fill="none" stroke="#C26A2E" stroke-width="3"/><path d="M592 690 L600 702 L608 690z" fill="#C26A2E"/><text x="250" y="586" font-size="19" font-weight="700" fill="#1F6F5C" text-anchor="middle">Oui</text><text x="550" y="586" font-size="19" font-weight="700" fill="#C26A2E" text-anchor="middle">Non</text><rect x="56" y="704" width="330" height="128" rx="16" fill="#E3EFEA" stroke="#E3EFEA" stroke-width="2"/><text x="221.0" y="748.0" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">Noter la raison</text><text x="221.0" y="775.0" font-size="20" font-weight="400" fill="#6B675F" text-anchor="middle">Refus : pourquoi ?</text><text x="221.0" y="802.0" font-size="20" font-weight="400" fill="#6B675F" text-anchor="middle">Report : quelle date ?</text><rect x="414" y="704" width="330" height="128" rx="16" fill="#F6E7DB" stroke="#F6E7DB" stroke-width="2"/><text x="579.0" y="748.0" font-size="20" font-weight="700" fill="#C26A2E" text-anchor="middle">Classer le dossier</text><text x="579.0" y="775.0" font-size="20" font-weight="400" fill="#6B675F" text-anchor="middle">Noter une date de rappel</text><text x="579.0" y="802.0" font-size="20" font-weight="400" fill="#6B675F" text-anchor="middle">dans 3 à 6 mois</text><text x="56" y="886" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Un dossier silencieux aujourd'hui peut revenir à la prochaine saison.</text></g></svg>