<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d"><title id="t">Quel canal pour quelle relance</title><desc id="d">Trois canaux de relance : le SMS pour les messages courts, l'appel pour échanger, l'e-mail pour garder une trace.</desc><rect width="800" height="800" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">Quel canal pour quelle relance</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Chaque canal a son rôle.</text><rect x="56" y="162" width="688" height="178" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="124" cy="251.0" r="44" fill="#E3E9F4"/><path d="M102 233.0 h44 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-26 l-12 10 v-10 h-6 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8z" fill="none" stroke="#3D5A98" stroke-width="4" stroke-linejoin="round"/><circle cx="112" cy="252.0" r="3.5" fill="#3D5A98"/><circle cx="124" cy="252.0" r="3.5" fill="#3D5A98"/><circle cx="136" cy="252.0" r="3.5" fill="#3D5A98"/><text x="196" y="214" font-size="27" font-weight="700" fill="#3D5A98" text-anchor="start">SMS</text><text x="196" y="248" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Pour les messages courts</text><circle cx="204" cy="277" r="4" fill="#3D5A98"/><text x="220" y="284" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Vérifier la réception du devis</text><circle cx="204" cy="307" r="4" fill="#3D5A98"/><text x="220" y="314" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Proposer un créneau</text><rect x="56" y="358" width="688" height="178" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="124" cy="447.0" r="44" fill="#E3EFEA"/><path d="M104 425.0 l10 -2 l8 16 l-7 6 a30 30 0 0 0 14 14 l6 -7 l16 8 l-2 10 a8 8 0 0 1 -8 6 a44 44 0 0 1 -43 -43 a8 8 0 0 1 6 -8z" fill="none" stroke="#1F6F5C" stroke-width="4" stroke-linejoin="round"/><text x="196" y="410" font-size="27" font-weight="700" fill="#1F6F5C" text-anchor="start">Appel</text><text x="196" y="444" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Pour échanger</text><circle cx="204" cy="473" r="4" fill="#1F6F5C"/><text x="220" y="480" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Lever un doute, ajuster une option</text><circle cx="204" cy="503" r="4" fill="#1F6F5C"/><text x="220" y="510" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Comprendre ce qui bloque</text><rect x="56" y="554" width="688" height="178" rx="18" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><circle cx="124" cy="643.0" r="44" fill="#F6E7DB"/><rect x="96" y="624.0" width="56" height="38" rx="6" fill="none" stroke="#C26A2E" stroke-width="4"/><path d="M98 628.0 L124 647.0 L150 628.0" fill="none" stroke="#C26A2E" stroke-width="4" stroke-linejoin="round"/><text x="196" y="606" font-size="27" font-weight="700" fill="#C26A2E" text-anchor="start">E-mail</text><text x="196" y="640" font-size="21" font-weight="600" fill="#1C1B19" text-anchor="start">Pour garder une trace</text><circle cx="204" cy="669" r="4" fill="#C26A2E"/><text x="220" y="676" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Récapituler un appel, envoyer une révision</text><circle cx="204" cy="699" r="4" fill="#C26A2E"/><text x="220" y="706" font-size="20" font-weight="400" fill="#6B675F" text-anchor="start">Clore un dossier</text><text x="56" y="764" font-size="19" font-weight="600" fill="#1C1B19" text-anchor="start">L'appel pour échanger, l'écrit pour garder une trace.</text></g></svg>