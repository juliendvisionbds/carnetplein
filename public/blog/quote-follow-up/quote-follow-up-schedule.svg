<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="t d"><title id="t">When to follow up on a quote</title><desc id="d">Six-step quote follow-up schedule, from the day the quote is sent to closing the file.</desc><rect width="800" height="940" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">When to follow up on a quote</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Every follow-up has a reason. Adjust the timing to your trade.</text><line x1="120" y1="190" x2="120" y2="800" stroke="#DDD8CE" stroke-width="4"/><circle cx="120" cy="190" r="22" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="4"/><text x="120" y="197" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">1</text><rect x="170" y="150" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="184" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">The day you send it</text><rect x="614" y="160" width="106" height="32" rx="16" fill="#E3EFEA"/><text x="667.0" y="182" font-size="17" font-weight="600" fill="#1F6F5C" text-anchor="middle">Notebook</text><text x="196" y="218" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Write down your first follow-up date</text><circle cx="120" cy="312" r="22" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="4"/><text x="120" y="319" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">2</text><rect x="170" y="272" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="306" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">Day 2</text><rect x="658" y="282" width="62" height="32" rx="16" fill="#E3EFEA"/><text x="689.0" y="304" font-size="17" font-weight="600" fill="#1F6F5C" text-anchor="middle">Text</text><text x="196" y="340" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Check the quote arrived and opens</text><circle cx="120" cy="434" r="22" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="4"/><text x="120" y="441" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">3</text><rect x="170" y="394" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="428" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">Day 7</text><rect x="658" y="404" width="62" height="32" rx="16" fill="#E3EFEA"/><text x="689.0" y="426" font-size="17" font-weight="600" fill="#1F6F5C" text-anchor="middle">Call</text><text x="196" y="462" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Answer questions, clear up a doubt</text><circle cx="120" cy="556" r="22" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="4"/><text x="120" y="563" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">4</text><rect x="170" y="516" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="550" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">Day 15</text><rect x="570" y="526" width="150" height="32" rx="16" fill="#E3EFEA"/><text x="645.0" y="548" font-size="17" font-weight="600" fill="#1F6F5C" text-anchor="middle">Text / email</text><text x="196" y="584" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Offer a concrete next step</text><circle cx="120" cy="678" r="22" fill="#FFFFFF" stroke="#1F6F5C" stroke-width="4"/><text x="120" y="685" font-size="20" font-weight="700" fill="#1F6F5C" text-anchor="middle">5</text><rect x="170" y="638" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="672" font-size="24" font-weight="700" fill="#1F6F5C" text-anchor="start">Before it expires</text><rect x="647" y="648" width="73" height="32" rx="16" fill="#E3EFEA"/><text x="683.5" y="670" font-size="17" font-weight="600" fill="#1F6F5C" text-anchor="middle">Email</text><text x="196" y="706" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Check in, without pressure</text><circle cx="120" cy="800" r="22" fill="#FFFFFF" stroke="#6B675F" stroke-width="4"/><text x="120" y="807" font-size="20" font-weight="700" fill="#6B675F" text-anchor="middle">6</text><rect x="170" y="760" width="574" height="88" rx="16" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="2"/><text x="196" y="794" font-size="24" font-weight="700" fill="#6B675F" text-anchor="start">After that</text><rect x="647" y="770" width="73" height="32" rx="16" fill="#EEEBE5"/><text x="683.5" y="792" font-size="17" font-weight="600" fill="#6B675F" text-anchor="middle">Email</text><text x="196" y="828" font-size="21" font-weight="400" fill="#1C1B19" text-anchor="start">Close the file, leave the door open</text><text x="56" y="896" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">Did the customer give you a date? That date wins.</text></g></svg>