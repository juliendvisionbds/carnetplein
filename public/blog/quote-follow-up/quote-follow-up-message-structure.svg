<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d"><title id="t">A useful follow-up, in 4 parts</title><desc id="d">Example follow-up text split into four parts: context, something useful, one question, an easy way out.</desc><rect width="800" height="800" rx="24" fill="#FAF8F4"/><g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="56" y="84" font-size="34" font-weight="700" fill="#1C1B19" text-anchor="start">A useful follow-up, in 4 parts</text><text x="56" y="122" font-size="21" font-weight="400" fill="#6B675F" text-anchor="start">Example: a text sent one week after the quote.</text><rect x="56" y="160" width="400" height="560" rx="44" fill="#1C1B19"/><rect x="70" y="174" width="372" height="532" rx="32" fill="#F1EEE8"/><rect x="206.0" y="186" width="100" height="10" rx="5" fill="#CFC9BE"/><text x="256.0" y="236" font-size="19" font-weight="600" fill="#6B675F" text-anchor="middle">Claire (kitchen project)</text><rect x="90" y="264" width="332" height="76" rx="16" fill="#E3EFEA"/><rect x="90" y="264" width="6" height="76" rx="3" fill="#1F6F5C"/><text x="112" y="296" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">Hi Claire, it's Mark</text><text x="112" y="323" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">from Oak &amp; Grain.</text><rect x="90" y="354" width="332" height="130" rx="16" fill="#F6E7DB"/><rect x="90" y="354" width="6" height="130" rx="3" fill="#C26A2E"/><text x="112" y="386" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">I checked: the quartz</text><text x="112" y="413" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">splashback fits your budget</text><text x="112" y="440" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">if we keep the laminate</text><text x="112" y="467" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">worktop.</text><rect x="90" y="498" width="332" height="49" rx="16" fill="#E3E9F4"/><rect x="90" y="498" width="6" height="49" rx="3" fill="#3D5A98"/><text x="112" y="530" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">Shall I add it to the quote?</text><rect x="90" y="561" width="332" height="76" rx="16" fill="#ECE7F2"/><rect x="90" y="561" width="6" height="76" rx="3" fill="#7A6A9A"/><text x="112" y="593" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">And if the project's on hold,</text><text x="112" y="620" font-size="18.5" font-weight="400" fill="#1C1B19" text-anchor="start">just let me know.</text><path d="M422 302.0 C 468 302.0, 458 220, 482 220" fill="none" stroke="#1F6F5C" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="504" cy="220" r="16" fill="#1F6F5C"/><text x="504" y="226" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="530" y="227" font-size="23" font-weight="700" fill="#1F6F5C" text-anchor="start">Context</text><text x="530" y="258" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Who you are,</text><text x="530" y="283" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">which project.</text><path d="M422 419.0 C 468 419.0, 458 352, 482 352" fill="none" stroke="#C26A2E" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="504" cy="352" r="16" fill="#C26A2E"/><text x="504" y="358" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="530" y="359" font-size="23" font-weight="700" fill="#C26A2E" text-anchor="start">Something useful</text><text x="530" y="390" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">An answer, an option,</text><text x="530" y="415" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">an available slot.</text><path d="M422 522.5 C 468 522.5, 458 484, 482 484" fill="none" stroke="#3D5A98" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="504" cy="484" r="16" fill="#3D5A98"/><text x="504" y="490" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="530" y="491" font-size="23" font-weight="700" fill="#3D5A98" text-anchor="start">One question</text><text x="530" y="522" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">Easy to answer,</text><text x="530" y="547" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">yes or no.</text><path d="M422 599.0 C 468 599.0, 458 616, 482 616" fill="none" stroke="#7A6A9A" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="504" cy="616" r="16" fill="#7A6A9A"/><text x="504" y="622" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="530" y="623" font-size="23" font-weight="700" fill="#7A6A9A" text-anchor="start">An easy way out</text><text x="530" y="654" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">They can say</text><text x="530" y="679" font-size="18" font-weight="400" fill="#6B675F" text-anchor="start">"not right now".</text><text x="56" y="774" font-size="19" font-weight="400" fill="#6B675F" text-anchor="start">A pushy follow-up asks. A useful one gives.</text></g></svg>